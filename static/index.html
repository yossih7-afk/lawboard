.wl-n{font-size:.9rem} .wl-s{font-size:.8rem;color:var(--muted)}
.adm-badge{display:inline-block;font-size:.7rem;font-weight:700;background:var(--today-bg);color:var(--today);border-radius:99px;padding:0 7px;margin-inline-start:4px;vertical-align:middle}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.85rem;color:var(--ink);cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw span{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--ink);font-weight:600}
.opt:has(input:checked){background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.2}
.brand small{color:var(--side-muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
.nav button{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:none;border:0;color:var(--side-ink);font:inherit;font-size:1rem;font-weight:600;padding:11px 12px;border-radius:9px;cursor:pointer;opacity:.85}
.nav button svg{flex:none;opacity:.9}
.nav button:hover{background:rgb(255 255 255 / .07);opacity:1}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);opacity:1}
.nav .cnt{margin-inline-start:auto;background:#C0392B;color:#fff;border-radius:99px;font-size:.75rem;padding:0 8px;line-height:1.6}
.nav .cnt:empty{display:none}
.me{display:flex;gap:10px;align-items:center;background:rgb(255 255 255 / .06);border:0;border-radius:10px;padding:10px;color:var(--side-ink);font:inherit;cursor:pointer;text-align:right}
.me small{display:block;color:var(--side-muted);font-size:.75rem} .me b{font-size:.95rem}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.main{min-width:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:0 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-block:26px 18px;border-bottom:1px solid var(--line)}
.ph h1{font-family:var(--display);font-size:2rem;margin:0;line-height:1.15}
.ph p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.ph-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.btn{padding:10px 18px;border-radius:9px}
.card{border-radius:12px;padding:20px}
ul.tasks,.tablewrap,.stat,.empty,.day{border-radius:12px}
li.task{padding:14px 16px}
.check{width:auto;height:auto;border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:700;color:var(--ink);gap:4px;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:24px;display:grid;gap:14px}
.welcome h2{font-family:var(--display);margin:0;font-size:1.45rem;font-weight:500}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.step{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.step b{font-size:1.02rem}
.step span{color:var(--muted);font-size:.92rem}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.picker button{font:inherit;font-weight:700;font-size:1.05rem;padding:16px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.picker button:hover{border-color:var(--accent);background:var(--soon-bg)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(40px,env(safe-area-inset-top,0px)) 16px 40px}
.gate .box{width:min(620px,100%);display:flex;flex-direction:column;gap:16px}
.gate h1{font-family:var(--display);font-size:2rem;margin:0}
.gate p{margin:0;color:var(--muted)}
.seg{margin-bottom:16px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:8px;z-index:10}
  .brand small,.brand div,.me span:not(.av){display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0}
  .side{max-width:100vw;overflow:hidden}
  .app{width:100%;overflow-x:hidden}
  .me{flex:none;padding:6px}
  .nav button{width:auto;white-space:nowrap;padding:8px 10px;font-size:.9rem}
  .nav button span.lbl{display:inline}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ph-side{align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="תפריט ראשי">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h14v3H5zm0 6.5h14v3H5zM5 17h9v3H5z" fill="currentColor"/></svg></span><div><b id="officeName">לוח בקרת תיקים</b><small>ניהול תיקים ומועדים</small></div></div>
    <nav id="tabs" class="nav"></nav>
    <button class="me" id="meBtn" type="button" title="החלפת משתמש"><span class="av" id="meAv">?</span><span><small>מחובר/ת כ־</small><b id="meName">—</b></span></button>
  </aside>
  <main class="main">
    <header class="ph">
      <div class="ph-text"><h1 id="pTitle">היום שלי</h1><p id="pDesc"></p></div>
      <div class="ph-side"><div class="dateline"><b id="gDate"></b><span id="hDate"></span></div>
        <div class="row"><button class="btn ghost" id="copyBrief" type="button">העתק סיכום בוקר</button><button class="btn" id="addCaseBtn" type="button">+ תיק חדש</button></div></div>
    </header>
    <div id="banners"></div>
    <section class="view" id="view"></section>
  </main>
</div>

<script>
const KINDS={
  hearing:{l:'דיון',crit:true}, defense:{l:'כתב הגנה',crit:true}, appeal:{l:'ערעור',crit:true},
  leave:{l:'בקשת רשות ערעור',crit:true}, setaside:{l:'ביטול פס"ד',crit:true},
  response:{l:'תגובה לבקשה'}, reply:{l:'תשובה לתגובה'}, affidavits:{l:'תצהירים'},
  discovery:{l:'הליכים מקדמיים'}, submission:{l:'הגשה / הודעה'}, internal:{l:'משימה פנימית'}
};
/* default working days a task needs before its deadline; editable per task */
const EFFORT={defense:5,appeal:6,leave:4,setaside:2,response:2,reply:1,affidavits:5,discovery:3,submission:1,hearing:2,internal:0};
const RULES=[
  {k:'defense',l:'כתב הגנה — סדר דין רגיל',d:60,from:'המצאת כתב התביעה'},
  {k:'defense',l:'כתב הגנה — סדר דין מהיר',d:30,from:'המצאת כתב התביעה'},
  {k:'response',l:'תגובה לבקשה',d:10,from:'המצאת הבקשה'},
  {k:'reply',l:'תשובה לתגובה',d:3,from:'המצאת התגובה'},
  {k:'appeal',l:'ערעור בזכות על פסק דין',d:60,from:'מתן פסק הדין / המצאתו'},
  {k:'leave',l:'בקשת רשות ערעור',d:30,from:'מתן ההחלטה / המצאתה'},
  {k:'setaside',l:'ביטול פס"ד שניתן בהיעדר',d:30,from:'המצאת פסק הדין'},
  {k:'submission',l:'מועד לפי החלטת בית המשפט',d:null,from:'מתן ההחלטה'}
];
const DOC_KINDS=['החלטה','פסק דין','פרוטוקול','כתב תביעה','כתב הגנה','כתב תשובה','בקשה','תגובה','תשובה לתגובה','תצהיר','חוות דעת','מכתב / תכתובת','מסמך שלנו (טיוטה/הוגש)','אחר'];
const S={cases:new Map(),tasks:new Map(),db:null,sample:null,assets:null,canWrite:true,deals:new Map(),loaded:{cases:false,tasks:false,deals:false},view:'today',q:'',owner:'',caseView:'open',flt:'',sort:null,tStatus:'open',xls:null,props:[]};
const $=s=>document.querySelector(s);
const $V=()=>document.getElementById('sub')||document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const dd=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const DOW=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const DOWL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const fmt=s=>{if(!s)return'';const d=pISO(s);return `יום ${DOW[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.${String(d.getFullYear()).slice(2)}`};
const rel=n=>n<0?(n===-1?'אתמול':`לפני ${-n} ימים`):n===0?'היום':n===1?'מחר':n===2?'מחרתיים':`בעוד ${n} ימים`;
/* office days are Sunday–Thursday */
const isBiz=s=>{const g=pISO(s).getDay();return g!==5&&g!==6};
const prevBiz=s=>{let d=addDays(s,-1);while(!isBiz(d))d=addDays(d,-1);return d};
const subBiz=(s,n)=>{let d=s;while(n>0){d=addDays(d,-1);if(isBiz(d))n--}return d};
const bizBetween=(a,b)=>{let n=0,d=a;while(d<=b){if(isBiz(d))n++;d=addDays(d,1)}return n};

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function caseOf(t){return S.cases.get(t.caseId)||(t.dealId&&S.deals?dealAsCase(t.dealId):null)||null}
function openTasks(){return [...S.tasks.values()].filter(t=>!t.done&&t.due)}
function effortOf(t){return t.effort!==undefined&&t.effort!==''&&t.effort!==null?Math.max(0,+t.effort||0):(EFFORT[t.kind]??1)}
/* work window: N office days ending the office day before the deadline (one day kept for review and filing) */
function plan(t){
  const e=effortOf(t);if(!e)return{e:0,start:t.due,end:t.due};
  const end=prevBiz(t.due),start=t.workFrom||subBiz(end,e-1);
  return{e,start,end};
}
function workState(t){
  const p=plan(t),T=today();if(!p.e||T<p.start||T>=t.due)return null;
  const done=bizBetween(p.start,T),left=bizBetween(T,p.end);
  return{...p,dayN:Math.min(done,p.e),left,tight:left<p.e-done+1&&T>p.start};
}
function bucket(t){if(t.done)return'done';const n=dd(today(),t.due);return n<0?'late':n===0?'today':n<=3?'soon':n<=7?'week':n<=30?'month':'later'}
function score(t){const n=dd(today(),t.due);return n-(KINDS[t.kind]?.crit?1.5:0)+(t.time?parseInt(t.time)/100:0)}
const byPri=(a,b)=>score(a)-score(b);
function people(){const s=new Set();for(const c of S.cases.values())c.owner&&s.add(c.owner);for(const t of S.tasks.values())t.assignee&&s.add(t.assignee);return[...s].sort((a,b)=>a.localeCompare(b,'he'))}
function nextFor(caseId){return openTasks().filter(t=>t.caseId===caseId).sort((a,b)=>a.due.localeCompare(b.due)||(a.time||'').localeCompare(b.time||''))[0]}
function mine(t){if(!S.owner)return true;if(S.owner==='__none')return !t.assignee;return t.assignee===S.owner||(!t.assignee&&caseOf(t)?.owner===S.owner)}
function asgHTML(t){
  if(t.done)return t.assignee?`<span>${esc(t.assignee)}</span>`:'';
  if(S.admin)return `<button type="button" class="asg ${t.assignee?'':'none'}" data-act="assign" data-id="${esc(t.id)}" title="שיוך לעובד">👤 ${esc(t.assignee||'לשייך לעובד')}</button>`;
  if(!t.assignee)return `<button type="button" class="asg none" data-act="take" data-id="${esc(t.id)}" title="לקחת את המשימה אליי">✋ אני אטפל</button>`;
  return `<span>👤 ${esc(t.assignee)}</span>`;
}
function assignSheet(id){
  const t=S.tasks.get(id);if(!t)return;const ppl=S.people||[];
  sheet(`<h2>למי להעביר את המשימה?</h2><p class="muted">${esc(t.title||'')} · ${esc(caseLabel(caseOf(t)))} · ${fmt(t.due)}</p>
    <div class="picker">${ppl.map(p=>`<button type="button" data-to="${esc(p)}" ${p===t.assignee?'style="border-color:var(--accent);background:var(--soon-bg)"':''}><span class="av">${esc(initials(p))}</span>${esc(p)}<small class="muted">${openTasks().filter(x=>x.assignee===p).length} פתוחות</small></button>`).join('')}</div>
    <div class="actions">${t.assignee?'<button class="btn ghost" type="button" data-to="">בטל שיוך</button>':''}<button class="btn ghost" type="button" data-close>ביטול</button></div>`,
  o=>o.querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',async()=>{const to=b.dataset.to;
    await saveTask(id,{assignee:to,assignedBy:S.me?.name||'',assignedAt:new Date().toISOString(),seen:to===S.me?.name});
    if(t.caseId&&to!==t.assignee)await addLog(t.caseId,`המשימה "${t.title||''}" ${to?'הועברה ל'+to:'הוחזרה ללא שיוך'}`,today());
    o.remove();toast(to?`הועבר ל${to}`:'השיוך בוטל')})));
}
function markSeen(t){if(t&&t.assignee&&t.assignee===S.me?.name&&t.seen===false)saveTask(t.id,{seen:true})}
function caseLabel(c){return c?(c.client||c.number||'תיק'):''}

/* ---------- rendering ---------- */
function header(){
  const d=new Date();
  $('#gDate').textContent=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  try{$('#hDate').textContent=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){}
}
function banners(){
  const b=[];
  if(!S.db)b.push(`<div class="banner"><span>הנתונים המשותפים של המשרד לא נטענו בתצוגה זו. פתחו את הדף כשאתם מחוברים לחשבון.</span></div>`);
  else if(!S.canWrite)b.push(`<div class="banner"><span>אין לכם הרשאה לעדכן. פנו למנהל המערכת.</span></div>`);
  $('#banners').innerHTML=b.join('');
}
function progBar(w){return `<div class="prog" aria-label="יום ${w.dayN} מתוך ${w.e}">${Array.from({length:w.e},(_,i)=>`<i class="${i<w.dayN-1?'on':i===w.dayN-1?'now':''}"></i>`).join('')}</div>`}
function taskRow(t,{showCase=true,mode=''}={}){
  const c=caseOf(t),b=bucket(t),n=dd(today(),t.due),k=KINDS[t.kind]||KINDS.internal;
  const sev=b==='late'||b==='today'?b:(b==='soon'?'soon':b==='done'?'done':'');
  const w=!t.done?workState(t):null,p=plan(t);
  const chips=[`<span class="chip ${t.kind==='hearing'?'hear':k.crit?'crit':''}">${esc(k.l)}</span>`];
  if(w)chips.push(`<span class="chip ${w.tight?'crit':'prep'}">${t.kind==='hearing'?'הכנה לדיון':'לעבוד על זה'} · יום ${w.dayN} מתוך ${w.e}${w.tight?' · לחוץ בזמן':''}</span>`);
  else if(mode==='upcoming'&&p.e)chips.push(`<span class="chip ok">להתחיל ${fmt(p.start)}</span>`);
  if(t.source&&t.source!=='ידני')chips.push(`<span class="chip src">${esc(t.source)}</span>`);
  const draftLbl=t.kind==='hearing'?'הכנה לדיון':'טיוטה';
  return `<li class="task s-${sev}">
    <button class="check" type="button" data-act="toggle" data-id="${esc(t.id)}" aria-pressed="${!!t.done}" title="${t.done?'החזר לרשימה':'סמן שהמשימה בוצעה'}" ${S.canWrite?'':'disabled'}>${t.done?'✓ בוצע':'✓ סיימתי'}</button>
    <div style="min-width:0"><div class="t-title" data-act="editTask" data-id="${esc(t.id)}">${esc(t.title||k.l)}</div>
      <div class="t-meta">${chips.join('')}${showCase&&c?`<a data-act="case" data-id="${esc(c.id)}">${esc(caseLabel(c))}</a><span>${esc([c.procType,c.number].filter(Boolean).join(' '))}</span>`:''}${asgHTML(t)}${t.assignee&&t.assignee===S.me?.name&&t.seen===false&&!t.done?'<span class="chip new">חדש לך</span>':''}${!t.done?`<a class="dr" data-act="draft" data-id="${esc(t.id)}">✎ ${draftLbl}</a>`:''}</div>
      ${w?progBar(w):''}</div>
    <div class="t-when"><b>${t.done?'בוצע':rel(n)}</b><span>${t.kind==='hearing'?'דיון ':'הגשה '}${fmt(t.due)}${t.time?' · '+esc(t.time):''}</span></div>
  </li>`;
}
function greet(){const h=new Date().getHours();return h<12?'בוקר טוב':h<17?'צהריים טובים':'ערב טוב'}
function ownerSelect(lbl){const ppl=[...new Set([...(S.people||[]),...people()])];return `<select id="ownerF" aria-label="סינון לפי עובד"><option value="">${lbl}</option>${ppl.map(p=>`<option value="${esc(p)}" ${p===S.owner?'selected':''}>${esc(p)}${p===S.me?.name?' (אני)':''}</option>`).join('')}<option value="__none" ${S.owner==='__none'?'selected':''}>לא שויכו</option></select>`}
function renderToday(){
  const T=today(),all=openTasks().filter(mine);
  const late=all.filter(t=>t.due<T).sort(byPri);
  const tod=all.filter(t=>t.due===T).sort(byPri);
  const work=all.filter(t=>workState(t)).sort((a,b)=>a.due.localeCompare(b.due));
  const up=all.filter(t=>t.due>T&&!workState(t)&&dd(T,t.due)<=30).sort((a,b)=>plan(a).start.localeCompare(plan(b).start)||a.due.localeCompare(b.due));
  const hearWeek=all.filter(t=>t.kind==='hearing'&&t.due>=T&&dd(T,t.due)<=7).length;
  const parts=[];
  if(late.length)parts.push(`<b>${late.length}</b> מועדים שחלפו ולא סומנו`);
  if(tod.length)parts.push(`<b>${tod.length}</b> להיום`);
  if(work.length)parts.push(`<b>${work.length}</b> מסמכים שכדאי לעבוד עליהם עכשיו`);
  let welcomed=false;try{welcomed=!!localStorage.getItem('lb.welcomed')}catch(e){}
  let h=welcomed?'':`<div class="welcome"><h2>ככה זה עובד</h2><div class="steps">
    <div class="step"><span class="n">1</span><b>כל בוקר — "היום שלי"</b><span>מה באיחור, מה להיום, ועל מה כדאי לעבוד עכשיו. כשמשהו בוצע, לוחצים "סיימתי".</span></div>

}

function detectKind(s){
  if(/דיון|ישיבה|קדם|הוכחות|תזכורת|טיעונים לעונש/.test(s))return'hearing';
  if(/בקשת רשות ערעור|בר"ע|רע"א/.test(s))return'leave';
  if(/ערעור/.test(s))return'appeal';
  if(/כתב הגנה/.test(s))return'defense';
  if(/תשובה לתגובה/.test(s))return'reply';
  if(/תגוב/.test(s))return'response';
  if(/תצהיר/.test(s))return'affidavits';
  if(/גילוי|עיון|שאלונים/.test(s))return'discovery';
  return'submission';
}
function parsePaste(text){
  const out=[];let cur=null;
  for(const ln of text.split(/\n+/).map(s=>s.trim()).filter(Boolean)){
    const cn=ln.match(/(\d{3,6}-\d{2}-\d{2})/);if(cn)cur=cn[1];
    const dates=[...ln.matchAll(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/g)].map(m=>{let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])});
    const tm=ln.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    const within=ln.match(/(?:תוך|בתוך)\s*(\d{1,3})\s*ימים/);
    if(!dates.length&&!within)continue;
    const kind=detectKind(ln);let due;
    if(within)due=calcDue(dates[0]||today(),+within[1],true).due;else due=dates[dates.length>1&&kind!=='hearing'?dates.length-1:0];
    out.push({caseNo:cur||'',due,time:kind==='hearing'&&tm?pad(+tm[1])+':'+tm[2]:'',kind,title:(KINDS[kind].l+' — '+ln.replace(/\s+/g,' ')).slice(0,140),sel:true});
  }
  return out;
}

const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error('load'))};document.head.appendChild(s)}))}
const PDFJS='/static/vendor/pdfjs/';
async function pdfText(buf){
  await loadScript(PDFJS+'pdf.min.js');await loadScript(PDFJS+'pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const pdf=await window.pdfjsLib.getDocument({data:buf,cMapUrl:PDFJS+'cmaps/',cMapPacked:true,standardFontDataUrl:PDFJS+'standard_fonts/'}).promise;let out='';
  /* pdf.js returns pieces in visual left-to-right order; Hebrew lines are rebuilt right-to-left */
  for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();const lines=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||10;
      let ln=lines.find(l=>Math.abs(l.y-y)<h*0.5);if(!ln){ln={y,items:[]};lines.push(ln)}ln.items.push({x,s:it.str})}
    lines.sort((a,b)=>b.y-a.y);
    out+=lines.map(l=>{const heb=l.items.some(t=>/[\u0590-\u05FF]/.test(t.s));l.items.sort((a,b)=>heb?b.x-a.x:a.x-b.x);return l.items.map(t=>t.s.trim()).join(' ').replace(/\s+/g,' ')}).join('\n')+'\n\n'}
  return{text:out,pages:pdf.numPages};
}
async function fileText(file){
  const n=file.name.toLowerCase();
  if(n.endsWith('.pdf'))return pdfText(await file.arrayBuffer());
  if(n.endsWith('.docx')){await loadScript('/static/vendor/mammoth.browser.min.js');const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return{text:r.value,pages:0}}
  if(n.endsWith('.txt')||n.endsWith('.md'))return{text:await file.text(),pages:0};
  throw new Error('type');
}

const MAXCH=100000;
/* returns saved doc data, or throws with a Hebrew message */
async function ingest(file,extra){
  if(file.size>20*1024*1024)throw new Error('הקובץ גדול מ־20MB.');
  let r;try{r=await fileText(file)}catch(e){throw new Error(e.message==='type'?'אפשר לקלוט PDF, Word (docx) או קובץ טקסט. קובץ doc ישן: שמרו אותו מחדש כ־docx.':'הקובץ לא נקרא. ייתכן שהוא פגום או מוגן בסיסמה.')}
  const clean=r.text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if(clean.length<40*Math.max(1,r.pages))throw new Error('המסמך נראה סרוק (תמונה בלי טקסט). העתיקו את הטקסט ידנית לתיבת "הדבקת טקסט", או בקשו גרסה דיגיטלית.');
  const data={...extra,name:file.name,text:clean.slice(0,MAXCH),truncated:clean.length>MAXCH,chars:clean.length,pages:r.pages||0,uploadedAt:new Date().toISOString()};
  try{const a=await uploadFile(file);data.fileId=a.id;data.assetUrl=a.url}catch(e){}
  return data;
}

/* ---------- drafting ---------- */
const DOCS=['כתב הגנה','כתב תשובה','תגובה לבקשה','תשובה לתגובה','הודעת עדכון לבית המשפט','בקשה להארכת מועד','בקשה למתן החלטה','בקשה לעיון בתיק','תצהיר עדות ראשית','תצהיר גילוי מסמכים','שאלון','הודעת ערעור','בקשת רשות ערעור','בקשה לביטול פסק דין','סיכומים','הכנה לדיון: ראשי פרקים לטיעון','מכתב ללקוח על מצב התיק'];
function guessDoc(t,c){const s=(t?.title||'')+' '+(c?.action||'');
  if(t?.kind==='hearing')return DOCS[15];if(t?.kind==='defense'||/כתב הגנה/.test(s))return DOCS[0];if(/כתב תשובה/.test(s))return DOCS[1];
  if(t?.kind==='reply')return DOCS[3];if(t?.kind==='response'||/תגוב/.test(s))return DOCS[2];if(/מתן החלטה/.test(s))return DOCS[6];if(/עיון בתיק/.test(s))return DOCS[7];
  if(t?.kind==='affidavits'||/תצהיר/.test(s))return DOCS[8];if(t?.kind==='discovery'||/שאלון|גילוי/.test(s))return DOCS[9];if(t?.kind==='appeal')return DOCS[11];if(t?.kind==='leave')return DOCS[12];
  if(t?.kind==='setaside')return DOCS[13];if(/אורכה|ארכה/.test(s))return DOCS[5];return DOCS[4]}
function clip(list,budget,label){let out='',left=budget;for(const d of list){if(left<500)break;const t=d.text.slice(0,left);out+=`\n=== ${label(d)} ===\n${t}${t.length<d.text.length?'\n[…המסמך קוצר…]':''}\n`;left-=t.length}return out}
function draftPrompt(doc,c,t,facts,docs,styles){
  const L=(k,v)=>v?`${k}: ${v}\n`:'';
  return `אתה עורך דין ישראלי מנוסה בליטיגציה. נסח טיוטה מלאה של המסמך: "${doc}", בעברית משפטית תקנית, לפי הנוהג בבתי המשפט בישראל ולפי תקנות סדר הדין האזרחי, התשע"ט-2018 (או הדין החל על סוג ההליך, למשל ענייני משפחה, ירושה או פלילי).

${S.settings?.signature?`פרטי המשרד לחתימה ולכותרת: ${S.settings.signature}\n\n`:''}פרטי התיק:
${L('סוג הליך ומספר',[c?.procType,c?.number].filter(Boolean).join(' '))}${L('פרטי ההליך כפי שנרשמו',c?.proc)}${L('צדדים',c?.title)}${L('הלקוח שלנו',c?.client)}${L('אנו מייצגים את',c?.side)}${L('ערכאה',c?.court)}${L('שופט/ת',c?.judge)}${L('היסטוריה וסטטוס',c?.notes)}${L('פעולה לביצוע',c?.action)}
${t?`המשימה בלוח: ${t.title||''} — מועד: ${t.due?fmt(t.due):''}${t.note?' ('+t.note+')':''}\n`:''}
הנחיות וחומר מעורך הדין:
${facts||'(לא נוספו הנחיות)'}
${docs?`\nמסמכי התיק (מהחדש לישן). קרא אותם בעיון ובסס עליהם את העובדות, את המענה לטענות ואת ההפניות לסעיפים:\n${docs}`:'\n(אין מסמכים שמורים בתיק.)'}
${styles?`\nדוגמאות למסמכים שהמשרד כתב בעבר. למד מהן את סגנון המשרד: מבנה, כותרות, פתיחים, אופן המענה לטענות, ניסוחים חוזרים, בקשות הסעד ובלוק החתימה. אל תעתיק מהן עובדות, שמות או מספרים:\n${styles}`:''}

כללים:
1. מבנה מסמך בית משפט מלא: שם בית המשפט ומספר ההליך, פרטי הצדדים ובאי כוחם, כותרת המסמך, פתיח, סעיפים ממוספרים עם כותרות משנה, סיום ובקשת הסעד, שורת תאריך וחתימת בא כוח. במכתב ללקוח או בהכנה לדיון התאם את המבנה. אם יש דוגמאות סגנון, המבנה שלהן גובר.
2. אל תמציא עובדות, תאריכים, סכומים, שמות או מספרים שאינם בחומר. מידע חסר כתוב בסוגריים מרובעים, למשל [להשלים: מועד המצאת כתב התביעה].
3. אל תמציא פסקי דין או מראי מקום. אסמכתא שאינך בטוח בה במדויק סמן [לאמת אסמכתא].
4. בכתב הגנה, בתגובה ובתשובה: התייחס לכל טענה של הצד שכנגד שמופיעה במסמכים, לפי סדרה, והבחן בין הכחשה, הודאה וטענה חלופית. הפנה לסעיפים במסמכים.
5. טקסט רגיל בלבד, ללא Markdown (בלי #, כוכביות או טבלאות), כדי שיודבק ישירות ל-Word.
6. בסוף, אחרי שורת קווים, כתוב "נקודות לבדיקת עורך הדין": עד 8 שורות קצרות על מה שחסר, מה צריך לאמת, ומה הסיכונים.`;
}
async function draftSheet(taskId,caseId){

  const key=taskId||('case-'+c.id);let saved=null;
  const [docs,styles]=await Promise.all([caseDocs(c.id),styleDocs()]);

  sheet(`<h2>טיוטה — ${esc(caseLabel(c))}</h2>

    <div class="card" style="background:var(--soon-bg);border:0"><b>איך מנסחים</b><ol style="margin:4px 0 0;padding-inline-start:20px"><li>לחצו <b>הכן חבילה ל-Claude</b>. כל פרטי התיק, המסמכים שסימנתם ודוגמאות הסגנון מועתקים.</li><li>לחצו <b>פתח את Claude</b>, הדביקו (Ctrl+V) ושלחו.</li><li>העתיקו את הטיוטה ש-Claude כתב והדביקו אותה בתיבה למטה. לחצו "שמור טיוטה בתיק".</li></ol>

/* ---------- office server: storage, files, login ---------- */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
async function api(method,url,body){
  const h={'X-User':encodeURIComponent(S.me?.name||'')};if(body!==undefined)h['Content-Type']='application/json';
  const r=await fetch(url,{method,credentials:'same-origin',headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){showUnlock();throw{code:'auth'}}
  if(r.status===409){showSetup();throw{code:'auth'}}
  if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw{code:r.status===413?'quota_exceeded':r.status===403?'forbidden':'unavailable',message:m}}
  return r.json();
}
/* same shape the board already uses: collection().doc().get/set/update/delete, where().get(), onSnapshot() */
function makeDB(){
  const subs={};
  const snapOf=rows=>({docs:rows.map(r=>{const{id,...d}=r;return{id,exists:true,data:()=>d}})});
  const refresh=async col=>{const rows=await api('GET','/api/c/'+col);(subs[col]||[]).forEach(f=>f(snapOf(rows)))};
  const ref=(col,id)=>{const u=`/api/c/${col}/${encodeURIComponent(id)}`;return{id,
    get:async()=>{const r=await api('GET',u);return{id,exists:r.exists,data:()=>r.data}},
    set:async d=>{await api('PUT',u,d);if(subs[col])refresh(col)},
    update:async d=>{await api('PATCH',u,d);if(subs[col])refresh(col)},
    delete:async()=>{await api('DELETE',u);if(subs[col])refresh(col)}}};
  const coll=col=>({doc:id=>ref(col,id||newId()),
    get:async()=>snapOf(await api('GET','/api/c/'+col)),
    where:(f,op,v)=>({get:async()=>snapOf(await api('GET',`/api/c/${col}?f=${encodeURIComponent(f)}&v=${encodeURIComponent(v)}`))}),
    onSnapshot:(fn,err)=>{(subs[col]=subs[col]||[]).push(fn);refresh(col).catch(err);setInterval(()=>{if(!document.hidden)refresh(col).catch(()=>{})},15000);return()=>{}}});
  return{collection:coll,doc:path=>{const[c,i]=path.split('/');return ref(c,i)},refresh};
}
async function uploadFile(file){
  const r=await fetch('/api/files?name='+encodeURIComponent(file.name),{method:'POST',credentials:'same-origin',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
  if(!r.ok)throw new Error('upload');return r.json();
}
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();

}
function downloadText(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

let ready=false,sent=false,payload=null;const trySend=()=>{if(ready&&payload&&!sent){sent=true;w.postMessage(payload,O)}};
addEventListener('message',e=>{if(e.source===w&&e.data==='nh-ready'){ready=true;trySend()}});
const docs=[document];document.querySelectorAll('iframe,frame').forEach(f=>{try{if(f.contentDocument)docs.push(f.contentDocument)}catch(e){}});

const files=[];for(const l of cand){try{const r=await fetch(l.href,{credentials:'include'});const ct=r.headers.get('content-type')||'';if(/pdf|msword|officedocument|octet-stream/i.test(ct)){const b=await r.blob();if(b.size>500&&b.size<25e6)files.push({linkText:l.text,rowText:l.row,name:(l.text||'מסמך').replace(/[\\\\/:*?"<>|]/g,' ').slice(0,90)+(/pdf/i.test(ct)?'.pdf':/word|officedocument/i.test(ct)?'.docx':''),type:ct,blob:b,href:l.href})}}catch(e){}}
payload={url:location.href,title:document.title,text,links:links.slice(0,600),files};trySend();try{w.postMessage('nh-ping',O)}catch(e){}})()`;
}

/* ---------- real-estate deals: control table with a checklist of stages ---------- */
const STAGES=[
  ['draft','טיוטה נשלחה'],['signed','ההסכם נחתם'],['cheque','שיק בנקאי / תשלום'],['poa','ייפויי כוח'],
  ['caveat','הערת אזהרה'],['tax','דיווח למיסוי'],['taxpaid','אישורי מס'],['city','אישור עירייה'],
  ['ila','אישור רמ"י / חברה משכנת'],['deed','שטר מכר'],['tabu','רישום בטאבו'],['keys','מסירת חזקה']];
const DEAL_TYPES=['מכר','רכישה','מתנה','שכירות','קומבינציה','פירוק שיתוף','משכנתא','אחר'];
function dealAsCase(id){const d=S.deals.get(id);return d?{id:d.id,client:d.name,number:d.property||'',procType:'עסקה',owner:d.owner||'',isDeal:true}:null}
function stageOf(d,k){return (d.stages||{})[k]||{}}
function dealProgress(d){const rel=STAGES.filter(([k])=>stageOf(d,k).s!=='na');const done=rel.filter(([k])=>stageOf(d,k).s==='done').length;return{done,total:rel.length,next:rel.find(([k])=>stageOf(d,k).s!=='done')}}
function dealTouched(d){return (d.statusAt||d.log?.[d.log.length-1]?.date||d.createdAt||'').slice(0,10)}
function stagePills(d){return `<div class="stg">${STAGES.map(([k,l])=>{const st=stageOf(d,k);return `<button type="button" class="pill ${st.s||'todo'}" data-act="stage" data-id="${esc(d.id)}" data-k="${k}" title="${esc(l)}${st.s==='done'&&st.d?' — '+fmt(st.d):st.s==='na'?' — לא רלוונטי':' — טרם'}">${st.s==='done'?'✓':st.s==='na'?'–':''}<span>${esc(l)}</span></button>`}).join('')}</div>`}
function renderDeals(){
  const all=[...S.deals.values()],closedView=S.dealView==='done';
  const active=all.filter(d=>d.status!=='הושלם'),done=all.filter(d=>d.status==='הושלם');
  let list=closedView?done:active;const q=(S.dq||'').trim();
  if(S.owner&&S.owner!=='__none')list=list.filter(d=>d.owner===S.owner);
  if(q)list=list.filter(d=>[d.fileNo,d.name,d.property,d.otherLawyer,d.otherContact,d.ourSide,d.dealType,d.action,d.notes].join(' ').includes(q));
  const stuck=d=>{const t=dealTouched(d);return !t||dd(t,today())>14};
  const signed=d=>stageOf(d,'signed').s==='done';
  if(!closedView&&S.dflt==='stuck')list=list.filter(stuck);
  if(!closedView&&S.dflt==='signed')list=list.filter(signed);
  if(!closedView&&S.dflt==='unsigned')list=list.filter(d=>!signed(d));
  list.sort((a,b)=>dealTouched(a).localeCompare(dealTouched(b)));
  const cnt={stuck:active.filter(stuck).length,signed:active.filter(signed).length,unsigned:active.filter(d=>!signed(d)).length};
  $V().innerHTML=`<div class="row" style="margin-bottom:12px"><div class="seg" role="tablist"><button type="button" data-dv="active" aria-selected="${!closedView}">עסקאות פעילות (${active.length})</button><button type="button" data-dv="done" aria-selected="${closedView}">הושלמו (${done.length})</button></div>
    ${S.canWrite?'<button class="btn" type="button" data-act="newDeal">+ עסקה חדשה</button>':''}<button class="btn ghost" type="button" data-act="dealImport">קליטה מאקסל</button></div>
  ${closedView?'':`<div class="flt">${[['','כל הפעילות'],['unsigned','לפני חתימה'],['signed','אחרי חתימה'],['stuck','לא עודכנו 14+ יום']].map(([k,l])=>`<button type="button" data-dflt="${k}" aria-pressed="${(S.dflt||'')===k}">${l}${k?` <b>${cnt[k]}</b>`:''}</button>`).join('')}</div>`}
  <div class="toolbar"><input type="search" id="dq" placeholder="חיפוש לפי שם, גוש/חלקה, עו&quot;ד הצד השני…" value="${esc(q)}">${ownerSelect('כל המשרד')}</div>
  ${list.length?`<div class="tablewrap"><table class="ctl deals"><thead><tr><th>תיק</th><th>עסקה</th><th>הצד השני</th><th>שלבים <small class="muted">(לחצו על שלב לעדכון)</small></th><th>השלב הבא</th><th>פעולה לביצוע</th><th>אחראי</th><th>עודכן</th></tr></thead><tbody>${list.map(d=>{const p=dealProgress(d),t=dealTouched(d),ago=t?dd(t,today()):null;
    return `<tr><td class="num"><a data-act="deal" data-id="${esc(d.id)}">${esc(d.fileNo)||'—'}</a></td>
      <td><a data-act="deal" data-id="${esc(d.id)}"><b>${esc(d.name)}</b></a><br><span class="muted sm">${esc([d.dealType,d.property,d.ourSide&&('אנחנו: '+d.ourSide)].filter(Boolean).join(' · '))}</span></td>
      <td>${esc(d.otherLawyer)||'<span class="muted">—</span>'}${d.otherContact?`<br><span class="muted sm" style="overflow-wrap:anywhere">${esc(d.otherContact)}</span>`:''}</td>
      <td>${stagePills(d)}<div class="pbar"><i style="width:${p.total?Math.round(p.done/p.total*100):0}%"></i></div><span class="muted sm">${p.done} מתוך ${p.total}</span></td>
      <td>${p.next?`<b>${esc(p.next[1])}</b>`:'<span class="chip ok">הכול בוצע</span>'}</td>
      <td class="ed" ${S.canWrite?`data-dedit="action" data-id="${esc(d.id)}" title="לחצו לעריכה"`:''}><span class="clamp">${esc(d.action)||'<span class="muted">—</span>'}</span></td>
      <td>${esc(d.owner)||'<span class="muted">—</span>'}</td>
      <td class="num ${ago!==null&&ago>14?'tl':''}">${ago===null?'—':ago===0?'היום':`לפני ${ago} ימים`}</td></tr>`}).join('')}</tbody></table></div><p class="note">${list.length} עסקאות. כל לחיצה על שלב מחליפה אותו: טרם ← בוצע (עם התאריך של היום) ← לא רלוונטי ← טרם.</p>`
   :`<div class="empty"><h3>${!S.loaded.deals?'טוען…':closedView?'אין עסקאות שהושלמו':'אין עסקאות פעילות'}</h3>${S.loaded.deals&&!closedView?'<p>הוסיפו עסקה חדשה, או קלטו את גיליון "טיוטת חוזים" מקובץ האקסל.</p>':''}</div>`}`;
  $('#dq').addEventListener('input',e=>{S.dq=e.target.value;renderDeals();const n=$('#dq');n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  document.querySelectorAll('[data-dv]').forEach(b=>b.addEventListener('click',()=>{S.dealView=b.dataset.dv;renderDeals()}));
  document.querySelectorAll('[data-dflt]').forEach(b=>b.addEventListener('click',()=>{S.dflt=b.dataset.dflt;renderDeals()}));
}
async function saveDeal(id,d){
  const now=new Date().toISOString();
  try{if(id){await S.db.doc('deals/'+id).update({...d,updatedAt:now});return id}
    const ref=S.db.collection('deals').doc();await ref.set({status:'פעיל',stages:{},log:[],...d,createdAt:now,updatedAt:now});return ref.id}catch(e){writeErr(e)}
}
async function dealLog(id,text,extra={}){const d=S.deals.get(id);if(!d)return;await saveDeal(id,{log:[...(d.log||[]),{date:today(),text,by:S.me?.name||''}].slice(-300),statusAt:today(),...extra})}
async function setStage(id,k,next){
  const d=S.deals.get(id);if(!d||!S.canWrite)return;const label=STAGES.find(x=>x[0]===k)[1],was=stageOf(d,k);
  const stages={...(d.stages||{}),[k]:next};
  await dealLog(id,next.s==='done'?(was.s==='done'?`עודכן תאריך: ${label}`:`בוצע: ${label}`):next.s==='na'?`סומן כלא רלוונטי: ${label}`:`בוטל הסימון: ${label}`,{stages});
  /* signing starts the tax-report clock: a declaration is due 30 days after the deal */
  if(k==='signed'&&next.s==='done'&&was.s!=='done'&&stageOf(d,'tax').s!=='done'&&!openTasks().some(t=>t.dealId===id&&/מיסוי|רשות המסים/.test(t.title||''))){
    let due=addDays(next.d||today(),30);while([5,6].includes(pISO(due).getDay()))due=addDays(due,1);
    await saveTask(null,{dealId:id,caseId:'',kind:'submission',title:'דיווח לרשות המסים (מיסוי מקרקעין)',due,time:'',assignee:d.owner||'',effort:2,source:'עסקה',note:'הצהרה למיסוי מקרקעין תוך 30 יום מיום החתימה. לאמת את המועד.'});
    toast('נפתחה משימה: דיווח למיסוי תוך 30 יום');
  }
}
function cycleStage(id,k){const d=S.deals.get(id);if(!d)return;const st=stageOf(d,k);return setStage(id,k,st.s==='done'?{s:'na'}:st.s==='na'?{}:{s:'done',d:today()})}

  sheet(`<h2>${d.id?'עריכת עסקה':'עסקה חדשה'}</h2><form id="dfm" class="grid2">

    <label class="f"><span>אחראי במשרד</span><select name="owner"><option value="">—</option>${(S.people||[]).map(p=>`<option ${p===d.owner?'selected':''}>${esc(p)}</option>`).join('')}</select></label>

    <div class="actions" style="grid-column:1/-1"><button class="btn" type="submit">שמור</button><button class="btn ghost" type="button" data-close>ביטול</button></div></form>`,

  sheet(`<div class="row" style="justify-content:space-between"><h2>${esc(d.name)}</h2><span class="chip ${d.status==='הושלם'?'ok':''}">${esc(d.status||'פעיל')}</span></div>
    <dl class="kv"><dt>תיק משרד</dt><dd>${esc(d.fileNo)}</dd><dt>סוג</dt><dd>${esc(d.dealType)}</dd><dt>נכס</dt><dd>${esc(d.property)}</dd><dt>הצד שלנו</dt><dd>${esc(d.ourSide)}</dd><dt>עו"ד הצד השני</dt><dd>${esc(d.otherLawyer)}</dd><dt>פרטי התקשרות</dt><dd style="overflow-wrap:anywhere">${esc(d.otherContact)}</dd>${d.price?`<dt>מחיר</dt><dd>${esc(d.price)}</dd>`:''}<dt>אחראי</dt><dd>${esc(d.owner)}</dd>${d.notes?`<dt>הערות</dt><dd>${esc(d.notes)}</dd>`:''}</dl>

async function saveCase(id,d){
  if(!S.db)return;const now=new Date().toISOString();
  try{if(id){await S.db.doc('cases/'+id).update({...d,updatedAt:now});return id}
    const ref=S.db.collection('cases').doc();await ref.set({status:'פעיל',...d,createdAt:now,updatedAt:now});return ref.id}
  catch(e){writeErr(e)}
}
async function upsertCase(d){const ex=[...S.cases.values()].find(c=>(d.number&&c.number===d.number)||(!d.number&&d.fileNo&&c.fileNo===d.fileNo&&c.client===d.client));
  if(ex){const patch={};for(const k in d)if(d[k]&&!ex[k])patch[k]=d[k];if(Object.keys(patch).length)await saveCase(ex.id,patch);return ex.id}
  return saveCase(null,d)}
async function saveTask(id,d){
  if(!S.db)return;const now=new Date().toISOString();
  try{if(id)await S.db.doc('tasks/'+id).update({...d,updatedAt:now});else await S.db.collection('tasks').doc().set({done:false,note:'',...d,createdAt:now,updatedAt:now})}

/* ---------- brief ---------- */
function briefText(){
  const T=today(),all=openTasks().filter(mine).sort(byPri);
  const line=x=>{const c=caseOf(x);return `• ${fmt(x.due)}${x.time?' '+x.time:''} | ${caseLabel(c)} ${c?.number||''} | ${x.title||KINDS[x.kind]?.l}${x.assignee?' | '+x.assignee:''}`};
  const pick=f=>all.filter(f).map(line).join('\n');
  const work=all.filter(x=>workState(x)).map(x=>{const w=workState(x);return line(x)+` (יום ${w.dayN}/${w.e})`}).join('\n');
  return `סיכום בוקר — ${new Date().toLocaleDateString('he-IL')}\n\n⚠ באיחור:\n${pick(x=>x.due<T)||'אין'}\n\nהיום:\n${pick(x=>x.due===T)||'אין'}\n\nלעבוד עליהם עכשיו:\n${work||'אין'}`;
}

    case'nhOpen':closeAll();nhSheet(id);break;
    case'nhDone':await api('PATCH','/api/c/inbox/'+id,{status:'done'});closeAll();if(S.view==='nh')render();toast('סומן כטופל');break;
    case'nhDel':{if(!a.dataset.sure){a.dataset.sure=1;a.textContent='לחצו שוב';return}const r=await api('GET','/api/c/inbox/'+id);for(const f of r.data?.files||[])if(!f.savedDocId)fetch('/api/files/'+f.fileId,{method:'DELETE'}).catch(()=>{});await api('DELETE','/api/c/inbox/'+id);render();break}
    case'draft':closeAll();markSeen(S.tasks.get(id));draftSheet(id,S.tasks.get(id)?.caseId);break;
    case'draftCase':closeAll();draftSheet(null,id);break;
    case'viewDoc':{const o=a.closest('.overlay'),d=o?._docs?.find(x=>x.id===id);if(d)sheet(`<h2>${esc(d.name)}</h2><textarea readonly class="draft">${esc(d.text)}</textarea><div class="actions"><button class="btn ghost" data-close type="button">סגור</button></div>`);break}
    case'delDoc':{if(!a.dataset.sure){a.dataset.sure=1;a.textContent='לחצו שוב';return}const o=a.closest('.overlay'),d=o?._docs?.find(x=>x.id===id);
      try{await S.db.doc('docs/'+id).delete();if(d?.fileId)fetch('/api/files/'+d.fileId,{method:'DELETE'}).catch(()=>{});toast('המסמך נמחק');o?._refresh?.()}catch(err){writeErr(err)}break}
    case'delStyle':{if(!a.dataset.sure){a.dataset.sure=1;a.textContent='לחצו שוב';return}try{await S.db.doc('style/'+id).delete();S._styleList?.()}catch(err){writeErr(err)}break}
    case'delPerson':{if(!a.dataset.sure){a.dataset.sure=1;a.textContent='לחצו שוב';return}await savePeople((S.people||[]).filter(p=>p!==id));render();break}
  }
});
let rt;const soon=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.editing)return;if(['tools','settings','nh'].includes(S.view)){banners();return}if(document.activeElement?.id==='q'){renderCases();const n=$('#q');n.focus();return}if(document.activeElement?.id==='dq')return;render()},60)};

/* ---------- first run, office code, who am I, administrators ---------- */
function gate(html,bind){document.querySelector('.gate')?.remove();const g=document.createElement('div');g.className='gate';g.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(g);bind&&bind(g);g.querySelector('input,button')?.focus();return g}
function showSetup(){
  gate(`<h1>ברוכים הבאים</h1><p>ארבע שאלות קצרות, ומתחילים. אפשר לשנות הכול אחר כך בהגדרות.</p>
    <form id="su" class="card" style="gap:16px">
      <label class="f"><span>1. שם המשרד</span><input type="text" name="officeName" placeholder='למשל: משרד עו"ד שמיר' required></label>
      <label class="f"><span>2. מי עובד במשרד? שם אחד בכל שורה</span><textarea name="people" id="suPpl" style="min-height:120px" placeholder="לדוגמה:&#10;יוסי&#10;צבי&#10;סיוון" required></textarea></label>
      <div class="grid2"><label class="f"><span>3. מי מנהל המערכת?</span><select name="adminName" id="suAdm" required><option value="">כתבו קודם את השמות למעלה</option></select></label>
      <label class="f"><span>קוד אישי למנהל (4 ספרות לפחות)</span><input type="password" name="adminPin" inputmode="numeric" minlength="4" required autocomplete="new-password"></label></div>
      <p class="note">המנהל מוסיף ומסיר עובדים, משנה את העיצוב ומגדיר מנהלים נוספים. הוא מקליד את הקוד האישי כשהוא בוחר בשם שלו.</p>
      <label class="f"><span>4. קוד כניסה למשרד כולו (לא חובה)</span><input type="text" name="code" inputmode="numeric" placeholder="השאירו ריק אם לא צריך"></label>
      <p class="note">אם תקבעו קוד משרד, כל מחשב חדש יקליד אותו פעם אחת. בלי קוד, כל מי שמחובר לרשת של המשרד יוכל להיכנס.</p>
      <p class="note" id="suErr" style="color:var(--late)"></p>
      <div class="actions"><button class="btn" type="submit">התחלה</button></div></form>`,
  g=>{const ta=g.querySelector('#suPpl'),sel=g.querySelector('#suAdm');
    ta.addEventListener('input',()=>{const v=sel.value,ppl=ta.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);sel.innerHTML=ppl.length?ppl.map(p=>`<option ${p===v?'selected':''}>${esc(p)}</option>`).join(''):'<option value="">כתבו קודם את השמות למעלה</option>'});
    g.querySelector('#su').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
      const people=d.people.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
      const r=await fetch('/api/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({officeName:d.officeName,people,code:d.code,adminName:d.adminName,adminPin:d.adminPin})});
      if(r.ok){try{localStorage.removeItem('lb.me')}catch(x){}
        await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.adminName,pin:d.adminPin})});
        try{localStorage.setItem('lb.me',d.adminName)}catch(x){}location.reload()}
      else g.querySelector('#suErr').textContent='השמירה נכשלה. נסו לרענן את הדף.'})});
}
function showUnlock(){
  gate(`<h1>קוד המשרד</h1><p>המחשב הזה עוד לא מוכר למערכת. הקלידו את קוד המשרד פעם אחת, והמחשב יזכור אותו.</p>
    <form id="ul" class="card" style="gap:14px"><label class="f"><span>קוד</span><input type="password" name="code" inputmode="numeric" autocomplete="off" required></label>
    <p class="note" id="ulErr" style="color:var(--late)"></p><div class="actions"><button class="btn" type="submit">כניסה</button></div>
    <p class="note">שכחתם את הקוד? במחשב הראשי, בתיקייה C:\\LawBoard, לחצו פעמיים על reset-code.bat.</p></form>`,
  g=>g.querySelector('#ul').addEventListener('submit',async e=>{e.preventDefault();const code=new FormData(e.target).get('code');
    const r=await fetch('/api/unlock',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    if(r.ok)location.reload();else{let m='הקוד לא נכון';try{m=(await r.json()).error||m}catch(x){}g.querySelector('#ulErr').textContent=m}}));
}
function initials(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')}
function setMe(name){if(S.me?.name!==name&&!S.ownerSet){S.owner=[...S.tasks.values()].some(t=>!t.done&&t.assignee===name)?name:''}S.me={name};try{localStorage.setItem('lb.me',name)}catch(e){}$('#meName').textContent=name;$('#meAv').textContent=initials(name);markAdmin()}
function markAdmin(){document.body.classList.toggle('not-admin',!S.admin);const b=$('#meName');if(b)b.innerHTML=esc(S.me?.name||'—')+(S.admin?' <span class="adm-badge">מנהל</span>':'')}
async function loadAdmin(){try{const a=await api('GET','/api/admin');S.admin=a.admin&&a.admin===S.me?.name?a.admin:null;S.admins=a.admins||[];
  if(a.admin&&a.admin!==S.me?.name){await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});S.admin=null}}catch(e){S.admin=null;S.admins=[]}markAdmin()}
function adminPinGate(name,after){
  gate(`<h1>שלום ${esc(name)}</h1><p>אתה מוגדר כמנהל המערכת. הקלד את הקוד האישי שלך.</p>
    <form id="ap" class="card" style="gap:14px"><label class="f"><span>קוד אישי</span><input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required></label>
    <p class="note" id="apErr" style="color:var(--late)"></p>
    <div class="actions"><button class="btn" type="submit">כניסה כמנהל</button><button class="btn ghost" type="button" id="apSkip">המשך בלי הרשאות מנהל</button></div>
    <p class="note">שכחת את הקוד? במחשב הראשי, בתיקייה C:\\LawBoard, לחץ פעמיים על reset-code.bat, ואז הגדר מנהל מחדש בהגדרות.</p></form>`,
  g=>{g.querySelector('#apSkip').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});S.admin=null;setMe(name);g.remove();after&&after()});
    g.querySelector('#ap').addEventListener('submit',async e=>{e.preventDefault();const pin=new FormData(e.target).get('pin');
      const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,pin})});
      if(r.ok){S.admin=name;setMe(name);g.remove();after&&after()}else{let m='הקוד לא נכון';try{m=(await r.json()).error||m}catch(x){}g.querySelector('#apErr').textContent=m}})});
}
function pick(name){
  if((S.admins||[]).includes(name))return adminPinGate(name,()=>{document.querySelector('.gate')?.remove();render()});
  fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});S.admin=null;setMe(name);document.querySelector('.gate')?.remove();render();
}
function showWho(canCancel){
  const ppl=S.people||[];
  gate(`<h1>מי עובד/ת על המחשב הזה?</h1><p>לחצו על השם שלכם. כך המערכת יודעת מי עדכן כל דבר. אפשר להחליף בכל רגע מהתפריט.</p>
    <div class="picker">${ppl.map(p=>`<button type="button" data-who="${esc(p)}"><span class="av">${esc(initials(p))}</span>${esc(p)}${(S.admins||[]).includes(p)?'<span class="adm-badge">מנהל</span>':''}</button>`).join('')}</div>
    <form id="wf" class="row"><input type="text" name="n" placeholder="השם שלי לא ברשימה — הקלידו כאן" style="flex:1 1 220px;width:auto"><button class="btn ghost" type="submit">הוסף והמשך</button></form>
    ${canCancel?'<div class="actions"><button class="btn ghost" type="button" id="wc">ביטול</button></div>':''}`,
  g=>{g.querySelectorAll('[data-who]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.who)));
    g.querySelector('#wc')?.addEventListener('click',()=>g.remove());
    g.querySelector('#wf').addEventListener('submit',async e=>{e.preventDefault();const n=new FormData(e.target).get('n').trim();if(!n)return;
      if(!ppl.includes(n))await savePeople([...ppl,n]);pick(n)});});
}
async function savePeople(list){S.people=list;await S.db.doc('settings/people').set({list})}
async function saveSettings(patch){S.settings={...S.settings,...patch};await S.db.doc('settings/main').set(S.settings);applyTheme()}

/* ---------- connect the Claude desktop app ---------- */
async function cldCard(){
  const box=$('#cldBox');if(!box)return;let st={connected:false};try{st=await api('GET','/api/claude')}catch(e){}
  box.innerHTML=st.connected?`<span class="chip ok">מחובר</span><span class="muted">אם עדיין לא עשיתם זאת: סגרו את אפליקציית Claude לגמרי (גם מהסמל ליד השעון) ופתחו מחדש.</span><button class="btn ghost sm" type="button" id="cldGo">חבר שוב</button>`
    :`<button class="btn" type="button" id="cldGo">חבר את אפליקציית Claude</button>`;
  $('#cldGo').addEventListener('click',async()=>{try{await api('POST','/api/claude/connect',{});
    sheet(`<h2>החיבור הוגדר</h2><ol style="margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px"><li><b>סגרו את אפליקציית Claude לגמרי</b>: גם מהסמל שליד השעון בתחתית המסך (לחצן ימני ← Quit).</li><li>פתחו את אפליקציית Claude מחדש.</li><li>פתחו שיחה חדשה וכתבו: <b>"מה דחוף היום בלוח התיקים?"</b></li><li>בפעם הראשונה Claude יבקש אישור להשתמש בכלים של "lawboard". אשרו (אפשר לבחור "אשר תמיד").</li></ol><div class="actions"><button class="btn" type="button" data-close>הבנתי</button></div>`);cldCard()}
    catch(e){toast(e.message||'החיבור נכשל')}});
}

/* ---------- software updates ---------- */
async function updCard(){
  const box=$('#updBox');if(!box)return;
  let u;try{u=await api('GET','/api/update')}catch(e){box.textContent=e.message||'לא הצלחתי לבדוק עדכונים.';return}
  $('#updCur').textContent=u.current;if(u.repo&&!$('#updRepo').value)$('#updRepo').value=u.repo;
  if(!u.configured){box.innerHTML='עדיין לא הוגדר מקור לעדכונים. הקלידו את שם המאגר ב-GitHub ולחצו "שמור מקור".';return}
  if(!u.available){box.innerHTML=`<span class="chip ok">המערכת מעודכנת</span> (הגרסה האחרונה: ${esc(u.latest)})`;return}
  box.innerHTML=`<div class="banner" style="margin:0;background:var(--soon-bg)"><span><b>יש גרסה חדשה: ${esc(u.latest)}</b>${u.notes?'<br>'+esc(u.notes):''}</span><button class="btn" type="button" id="updGo">עדכן עכשיו</button></div><p class="note">העדכון לוקח פחות מדקה. כל הנתונים נשמרים. המערכת תיעצר לכמה שניות ותחזור לבד.</p>`;
  $('#updGo').addEventListener('click',applyUpdate);
}
async function applyUpdate(){
  const g=gate('<h1>מעדכן…</h1><p>מוריד ומתקין את הגרסה החדשה. אל תסגרו את הדף.</p>');
  let before='';try{before=(await api('GET','/api/version')).version}catch(e){}
  try{await api('POST','/api/update/apply',{})}catch(e){g.remove();toast(e.message||'העדכון נכשל');return}
  const t0=Date.now();
  const poll=async()=>{try{const r=await fetch('/api/version',{credentials:'same-origin'});if(r.ok){const v=(await r.json()).version;if(v&&v!==before||Date.now()-t0>8000){location.reload();return}}}catch(e){}
    if(Date.now()-t0>60000){g.querySelector('p').textContent='המערכת לא חזרה. במחשב הראשי, לחצו על קיצור הדרך "לוח בקרת תיקים".';return}setTimeout(poll,1500)};
  setTimeout(poll,2500);
}
async function updNotice(){if(!S.admin)return;try{const u=await api('GET','/api/update');if(u.available)toast(`יש גרסה חדשה (${u.latest}). לעדכון: הגדרות ועזרה ← עדכוני תוכנה`)}catch(e){}}

/* ---------- appearance ---------- */
const ACCENTS=[['#1F5A86','כחול'],['#17675A','ירוק'],['#5B3E96','סגול'],['#8E2F3C','בורדו'],['#36495C','אפור-כחול'],['#7A5200','חום-זהב']];
const SIZES=[['normal','רגיל','100%'],['large','גדול','112%'],['xl','גדול מאוד','125%']];
function applyTheme(){
  const th=S.settings.theme||{},root=document.documentElement;
  const mode=th.mode||'light';
  if(mode==='auto')delete root.dataset.theme;else root.dataset.theme=mode;
  if(th.accent&&mode!=='dark')root.style.setProperty('--accent',th.accent);else root.style.removeProperty('--accent');
  root.style.fontSize=(SIZES.find(x=>x[0]===th.size)||SIZES[0])[2];
  $('#officeName').textContent=S.settings.officeName||'לוח בקרת תיקים';
  const lg=document.querySelector('.brand .logo');
  if(lg)lg.classList.toggle('has-img',!!th.logo);
  if(lg)lg.innerHTML=th.logo?`<img src="${esc(th.logo)}" alt="לוגו המשרד">`:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h14v3H5zm0 6.5h14v3H5zM5 17h9v3H5z" fill="currentColor"/></svg>';
}
async function init(){
  header();
  try{const v=localStorage.getItem('cb.view');if(v)S.view=v}catch(e){}
  S.settings={};drawNav();
  let me;try{me=await (await fetch('/api/me',{credentials:'same-origin'})).json()}catch(e){$('#view').innerHTML='<div class="empty"><h3>אין חיבור למערכת</h3><p>ודאו שהמחשב הראשי של המשרד דלוק ושהמערכת פועלת בו (קיצור הדרך "לוח בקרת תיקים"), ואז רעננו את הדף.</p></div>';return}
  if(me.setup){showSetup();return}
  if(me.locked){showUnlock();return}
  S.db=makeDB();
  try{const st=await S.db.doc('settings/main').get();if(st.exists)S.settings=st.data()}catch(e){}
  try{const pp=await S.db.doc('settings/people').get();S.people=pp.exists?pp.data().list||[]:(S.settings.people||[])}catch(e){S.people=S.settings.people||[]}
  applyTheme();
  let saved='';try{saved=localStorage.getItem('lb.me')||''}catch(e){}
  if(saved)S.me={name:saved};
  await loadAdmin();
  if(saved)setMe(saved);
  render();
  setTimeout(updNotice,3000);
  if(!saved)showWho(false);
  else if(S.admins.includes(saved)&&!S.admin)adminPinGate(saved,()=>{document.querySelector('.gate')?.remove();render()});
  const sub=(col)=>S.db.collection(col).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[col]=m;S.loaded[col]=true;soon()},err=>{S.loaded[col]=true;if(err?.code!=='auth')toast('אין חיבור למחשב הראשי. בודק שוב…')});
  sub('cases');sub('tasks');sub('deals');
  const nhc=async()=>{try{const n=(await api('GET','/api/c/inbox?lite=1')).filter(i=>i.status!=='done').length;if($('#nhCount'))$('#nhCount').textContent=n||''}catch(e){}};nhc();setInterval(nhc,60e3);
  setInterval(()=>{header();if(S.view==='today'||S.view==='cal')soon()},10*60e3);
}
init();
</script>
