<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קליטה מנט המשפט</title>
<style>
:root{--bg:#F5F4EF;--ink:#1B2630;--muted:#4A5560;--ok:#2E6A3E;--late:#B42318;--warn:#9A5806;--accent:#1F5A86;--line:#DEDCD3;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10161C;--ink:#E7ECEF;--muted:#9DA9B3;--ok:#7FC491;--late:#F28B7E;--warn:#E9B15C;--accent:#7DB4DA;--line:#2A3540;--surface:#18212A;color-scheme:dark}}
html,body{background:var(--bg);color:var(--ink);font-family:"Assistant","Segoe UI",Arial,sans-serif;margin:0}
main{padding:24px 20px;display:flex;flex-direction:column;gap:12px;font-size:16px}
h1{font-size:1.3rem;margin:0}
#st{color:var(--muted)} .ok{color:var(--ok);font-weight:700} .err{color:var(--late);font-weight:700}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.92rem}
li b{display:block}
.i-ok{border-inline-start:4px solid var(--ok)} .i-warn{border-inline-start:4px solid var(--warn)} .i-err{border-inline-start:4px solid var(--late)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 16px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>קליטה מנט המשפט</h1>
  <div id="st">ממתין לנתונים מהעמוד…</div>
  <div id="sum" class="sum" hidden></div>
  <ul id="items"></ul>
  <div><button type="button" id="closeBtn" hidden>סגור</button></div>
</main>
<script src="/static/vendor/pdfjs/pdf.min.js"></script>
<script src="/static/vendor/pdfjs/pdf.worker.min.js"></script>
<script>
/* Receives a Net HaMishpat page from the bookmark button, saves every decision
   to the right case, and adds the deadlines and hearings it finds. */
const $=s=>document.querySelector(s);
const say=(t,c)=>{$('#st').textContent=t;$('#st').className=c||''};
const item=(title,detail,cls)=>{const li=document.createElement('li');li.className=cls;li.innerHTML='<b></b><span></span>';li.querySelector('b').textContent=title;li.querySelector('span').textContent=detail;$('#items').appendChild(li);return li};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>{const d=pISO(s);return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`};
const api=async(method,url,body)=>{const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(String(r.status));return r.json()};
const CASE_RE=/(\d{3,6}-\d{2}-\d{2})/g;
const DATE_RE=/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/g;
const toIso=m=>{let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])};

/* court days: count calendar days, skip the summer recess, and move a Friday/Saturday deadline to Sunday */
function deadline(from,days){let d=from,c=0;while(c<days){d=addDays(d,1);const m=+d.slice(5,7),x=+d.slice(8,10);if((m===7&&x>=16)||m===8)continue;c++}
  while([5,6].includes(pISO(d).getDay()))d=addDays(d,1);return d}
function kindOf(s){
  if(/דיון|ישיבה|קדם משפט|קד"מ|הוכחות|תזכורת|טיעונים לעונש/.test(s))return'hearing';
  if(/כתב (ה)?הגנה/.test(s))return'defense';if(/תשובה לתגובה/.test(s))return'reply';if(/תגוב/.test(s))return'response';if(/הודעת עדכון|הודעה מעדכנת/.test(s))return'submission';
  if(/תצהיר/.test(s))return'affidavits';if(/גילוי|שאלונים|הליכים מקדמיים/.test(s))return'discovery';if(/ערעור/.test(s))return'appeal';return'submission'}
const KL={hearing:'דיון',defense:'כתב הגנה',reply:'תשובה לתגובה',response:'תגובה',affidavits:'תצהירים',discovery:'הליכים מקדמיים',appeal:'ערעור',submission:'הגשה / הודעה'};

async function pdfText(blob){
  const PJ='/static/vendor/pdfjs/';pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+'pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer(),cMapUrl:PJ+'cmaps/',cMapPacked:true,standardFontDataUrl:PJ+'standard_fonts/'}).promise;let out='';
  for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();const lines=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||10;
      let ln=lines.find(l=>Math.abs(l.y-y)<h*.5);if(!ln){ln={y,items:[]};lines.push(ln)}ln.items.push({x,s:it.str})}
    lines.sort((a,b)=>b.y-a.y);
    out+=lines.map(l=>{const heb=l.items.some(t=>/[֐-׿]/.test(t.s));l.items.sort((a,b)=>heb?b.x-a.x:a.x-b.x);return l.items.map(t=>t.s.trim()).join(' ').replace(/\s+/g,' ')}).join('\n')+'\n\n'}
  return{text:out.trim(),pages:pdf.numPages};
}
let CASES=[];
function caseFor(...texts){
  for(const t of texts){const nums=[...String(t||'').matchAll(CASE_RE)].map(m=>m[1]);
    for(const n of nums){const c=CASES.find(c=>c.status!=='סגור'&&c.number&&(c.number===n||c.number.includes(n)))||CASES.find(c=>c.number&&c.number.includes(n));if(c)return c}}
  return null;
}
/* deadlines written inside a decision */
function decisionDeadlines(text,given){
  const out=[];const flat=text.replace(/\s+/g,' ');
  for(const s of flat.split(/(?<=[.;:])\s+|\n/)){
    const w=s.match(/(?:תוך|בתוך|בתוך\s)\s*(\d{1,3})\s*ימים/);const until=[...s.matchAll(/(?:עד ליום|עד יום|עד לתאריך|לא יאוחר מיום)\D{0,3}(\d{1,2})[./](\d{1,2})[./](\d{2,4})/g)];
    const hear=/(דיון|ישיבה|קדם משפט|הוכחות|תזכורת)/.test(s)&&[...s.matchAll(DATE_RE)];
    if(w)out.push({due:deadline(given,+w[1]),kind:kindOf(s),title:s.slice(0,120),how:`${w[1]} ימים מיום ההחלטה (${fmt(given)})`});
    for(const u of until)out.push({due:toIso(u.slice(0)),kind:kindOf(s),title:s.slice(0,120),how:'מועד שנקבע בהחלטה'});
    if(hear&&hear.length){const d=toIso(hear[hear.length-1]);const tm=s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(d>given)out.push({due:d,time:tm?pad(+tm[1])+':'+tm[2]:'',kind:'hearing',title:s.slice(0,120),how:'דיון שנקבע בהחלטה'})}
  }
  return out.filter(x=>x.due>=today());
}
async function addTask(c,x,origin){
  const ex=await api('GET','/api/c/tasks?f=caseId&v='+encodeURIComponent(c.id));
  if(ex.some(t=>!t.done&&t.due===x.due&&(t.kind===x.kind||t.kind==='hearing'&&x.kind==='hearing')))return false;
  await api('POST','/api/c/tasks',{caseId:c.id,kind:x.kind,title:(x.kind==='hearing'?'דיון: ':'')+x.title,due:x.due,time:x.time||'',assignee:c.owner||'',done:false,
    source:'נט המשפט',verify:true,note:`זוהה אוטומטית (${x.how}) — לאמת מול ${origin}`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  return true;
}
async function logCase(c,text){const cur=(await api('GET','/api/c/cases/'+c.id)).data||{};const log=[...(cur.log||[]),{date:today(),text,by:'נט המשפט'}].slice(-300);await api('PATCH','/api/c/cases/'+c.id,{log,statusAt:today()})}

async function save(p){
  say('שומר את העמוד…');
  let inbox;
  try{inbox=await api('POST','/api/c/inbox',{url:p.url,title:p.title,text:p.text,links:p.links,files:[],status:'new',capturedAt:new Date().toISOString().slice(0,19)})}
  catch(e){say(e.message==='401'||e.message==='409'?'צריך לפתוח את המערכת בדפדפן הזה קודם. אחר כך לחצו שוב על הכפתור.':'השמירה נכשלה. ודאו שהמערכת פועלת במחשב המשרד.','err');return}
  CASES=await api('GET','/api/c/cases');
  const pageCase=(()=>{const nums=[...new Set([...String(p.title+' '+p.text).matchAll(CASE_RE)].map(m=>m[1]))];return nums.length===1?caseFor(nums[0]):null})();
  let nDocs=0,nTasks=0,nLeft=0;const files=[];
  for(const f of p.files||[]){
    const li=item(f.name,'מוריד וקורא…','');
    try{
      const up=await (await fetch('/api/files?name='+encodeURIComponent(f.name),{method:'POST',credentials:'same-origin',headers:{'Content-Type':f.type||'application/octet-stream'},body:f.blob})).json();
      let text='',pages=0;if(/pdf/i.test(f.type||f.name)){try{const r=await pdfText(f.blob);text=r.text;pages=r.pages}catch(e){}}
      const c=caseFor(f.rowText,f.name,f.linkText,text.slice(0,1500))||pageCase;
      const dm=[...String(f.rowText+' '+f.name).matchAll(DATE_RE)].map(toIso).filter(d=>d<=today());
      const tg=text.match(/ניתנ[הו]\s+היום[^0-9]{0,20}(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
      const given=tg?toIso(tg):dm[0]||today();
      const entry={fileId:up.id,name:f.name,href:f.href,linkText:f.linkText||'',rowText:f.rowText||''};
      if(!c){files.push(entry);nLeft++;li.className='i-warn';li.querySelector('span').textContent='לא זוהה לאיזה תיק שייך. נשאר לבדיקה בלשונית "נט המשפט".';continue}
      const docs=await api('GET','/api/c/docs?lite=1&f=caseId&v='+encodeURIComponent(c.id));
      const name=f.linkText&&f.linkText.length>3?`${f.linkText}`.slice(0,90):f.name;
      if(docs.some(d=>d.href===f.href||d.name===name&&d.chars===text.length)){li.className='i-ok';li.querySelector('span').textContent=`כבר קיים בתיק ${c.client||c.number}.`;files.push({...entry,savedDocId:'dup',caseId:c.id});continue}
      const kind=/פסק[ -]דין|פס"ד/.test(name+text.slice(0,300))?'פסק דין':/פרוטוקול/.test(name+text.slice(0,300))?'פרוטוקול':'החלטה';
      const doc=await api('POST','/api/c/docs',{caseId:c.id,name,kind,docDate:given,text:text.slice(0,100000),truncated:text.length>100000,chars:text.length,pages,fileId:up.id,assetUrl:'/files/'+up.id,href:f.href,source:'נט המשפט',uploadedAt:new Date().toISOString()});
      nDocs++;files.push({...entry,savedDocId:doc.id,caseId:c.id});
      let added=0;for(const x of decisionDeadlines(text,given))if(await addTask(c,x,`${kind} מיום ${fmt(given)}`)){added++;nTasks++}
      await logCase(c,`התקבלה ${kind} מיום ${fmt(given)} מנט המשפט${added?`, נוספו ${added} מועדים`:''}`);
      li.className='i-ok';li.querySelector('span').textContent=`נשמר בתיק ${c.client||''} ${c.number||''}${added?` · נוספו ${added} מועדים`:''}${!text&&pages?' · סרוק, בלי טקסט':''}`;
    }catch(e){li.className='i-err';li.querySelector('span').textContent='נכשל: '+e.message;files.push({name:f.name,href:f.href,error:true});nLeft++}
  }
  /* hearings listed on the page itself (e.g. the lawyer's diary) */
  for(const line of String(p.text||'').split(/\n+/)){
    if(!/(דיון|ישיבה|קדם משפט|קד"מ|הוכחות|תזכורת)/.test(line))continue;
    const c=caseFor(line);const d=[...line.matchAll(DATE_RE)].map(toIso).filter(x=>x>=today());if(!c||!d.length)continue;
    const tm=line.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(await addTask(c,{due:d[0],time:tm?pad(+tm[1])+':'+tm[2]:'',kind:'hearing',title:line.trim().slice(0,110),how:'מופיע ביומן נט המשפט'},'נט המשפט')){nTasks++;item(`דיון: ${c.client||c.number} · ${fmt(d[0])}${tm?' '+tm[0]:''}`,'נוסף ליומן','i-ok')}
  }
  await api('PATCH','/api/c/inbox/'+inbox.id,{files,status:nLeft?'new':'done',auto:{docs:nDocs,tasks:nTasks,left:nLeft}});
  const s=$('#sum');s.hidden=false;
  s.textContent=`${nDocs} החלטות נשמרו בתיקים · ${nTasks} מועדים ודיונים נוספו (מסומנים "לאמת")${nLeft?` · ${nLeft} לא זוהו ונשארו לבדיקה בלשונית "נט המשפט"`:''}${!(p.files||[]).length?' · בעמוד הזה לא נמצאו קבצים להורדה':''}`;
  say('הקליטה הסתיימה.','ok');$('#closeBtn').hidden=false;
}
$('#closeBtn').addEventListener('click',()=>window.close());
let busy=false;
addEventListener('message',e=>{
  let host='';try{host=new URL(e.origin).hostname}catch(x){}
  if(!(host==='court.gov.il'||host.endsWith('.court.gov.il')))return;
  if(e.data==='nh-ping'&&window.opener){window.opener.postMessage('nh-ready','*');return}
  if(e.data&&typeof e.data==='object'&&'text' in e.data&&!busy){busy=true;save(e.data).catch(err=>say('הקליטה נכשלה: '+err.message,'err'))}
});
fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(m=>{
  if(m.setup||m.locked){say('צריך לפתוח את המערכת בדפדפן הזה קודם (ולהקליד את קוד המשרד אם יש). אחר כך לחצו שוב על הכפתור בנט המשפט.','err');return}
  if(window.opener)window.opener.postMessage('nh-ready','*');else say('פתחו את החלון הזה דרך הכפתור "שמור מנט המשפט" בסרגל הסימניות.');
}).catch(()=>say('אין חיבור למערכת.','err'));
setTimeout(()=>{if(!busy&&$('#st').className!=='err')say('לא הגיעו נתונים. לחצו שוב על הכפתור בעמוד של נט המשפט.')},15000);
</script>
</body>
</html>
